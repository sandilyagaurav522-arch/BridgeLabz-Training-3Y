<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Student Form Validator</title><style>body{font:16px Arial;max-width:520px;margin:30px auto}label{display:block;margin:12px 0}input{display:block;width:100%;padding:8px;box-sizing:border-box}.valid{border:2px solid green}.invalid{border:2px solid red}.error{color:red}</style><h1>Student Registration</h1><form id="studentForm" novalidate><label>Name<input id="name" required></label><div id="nameError" class="error"></div><label>Email<input id="email" required></label><div id="emailError" class="error"></div><label>Phone<input id="phone" maxlength="10" required></label><div id="phoneError" class="error"></div><label>Password<input id="password" type="password" required></label><div id="passwordError" class="error"></div><button>Validate</button></form><p id="result"></p><script src="Q2_Student_Form_Validator.js"></script></html>
