<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Gallery with Modal</title>
<style>
body{font-family:Arial,sans-serif;margin:30px;background:#f5f5f5}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:900px}
.gallery img{width:100%;height:160px;object-fit:cover;cursor:pointer;border-radius:8px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}.modal-content{background:white;padding:12px;border-radius:8px;max-width:90vw;max-height:90vh}
.modal-content img{max-width:85vw;max-height:75vh;display:block}.close{float:right}
</style>
</head>
<body>
<h1>Image Gallery</h1>
<div class="gallery" id="gallery">
<img src="https://picsum.photos/id/1015/800/600" alt="Mountain landscape">
<img src="https://picsum.photos/id/1025/800/600" alt="Dog portrait">
<img src="https://picsum.photos/id/1035/800/600" alt="Forest landscape">
<img src="https://picsum.photos/id/1043/800/600" alt="Ocean landscape">
<img src="https://picsum.photos/id/1069/800/600" alt="Nature scene">
<img src="https://picsum.photos/id/1074/800/600" alt="Wildlife scene">
</div>
<div class="modal" id="modal" aria-hidden="true">
<div class="modal-content" id="modal-content">
<button class="close" id="close-modal" aria-label="Close">Close ✕</button>
<img id="large-image" alt="">
<p id="image-caption"></p>
</div>
</div>
<script>
const gallery = document.querySelector("#gallery");
const modal = document.querySelector("#modal");
const modalContent = document.querySelector("#modal-content");
const largeImage = document.querySelector("#large-image");
const caption = document.querySelector("#image-caption");

gallery.addEventListener("click", (event) => {
    if (event.target.tagName !== "IMG") return;
    largeImage.src = event.target.src;
    largeImage.alt = event.target.alt;
    caption.textContent = event.target.alt;
    modal.classList.add("open");
    modal.setAttribute("aria-hidden", "false");
});
function closeModal() {
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden", "true");
}
modal.addEventListener("click", closeModal);
modalContent.addEventListener("click", (event) => {
    // Stop the click from bubbling to the backdrop, so the modal stays open.
    event.stopPropagation();
});
document.querySelector("#close-modal").addEventListener("click", closeModal);
</script>
</body>
</html>
