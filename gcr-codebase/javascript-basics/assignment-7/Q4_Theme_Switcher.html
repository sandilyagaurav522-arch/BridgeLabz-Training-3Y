<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theme Switcher</title>
<style>
body{font-family:Arial,sans-serif;min-height:100vh;margin:0;padding:40px;box-sizing:border-box;transition:.2s}
body[data-theme="light"]{background:#fff;color:#222}
body[data-theme="dark"]{background:#181818;color:#f5f5f5}
body[data-theme="blue"]{background:#e4f1ff;color:#123a68}
button{padding:10px 16px;margin:5px;cursor:pointer}
</style>
</head>
<body data-theme="light" data-current-theme="light">
<h1>Theme Switcher</h1><p>Choose a theme below.</p>
<button data-theme-choice="light">Light</button>
<button data-theme-choice="dark">Dark</button>
<button data-theme-choice="blue">Blue</button>
<p>Current theme: <strong id="current-theme">Light</strong></p>
<script>
const themeLabel = document.querySelector("#current-theme");
document.querySelectorAll("button[data-theme-choice]").forEach((button) => {
    button.addEventListener("click", () => {
        const theme = button.getAttribute("data-theme-choice");
        // setAttribute applies the selected theme and stores the custom attribute.
        document.body.setAttribute("data-theme", theme);
        document.body.setAttribute("data-current-theme", theme);
        themeLabel.textContent = theme[0].toUpperCase() + theme.slice(1);
    });
});
</script>
</body>
</html>
