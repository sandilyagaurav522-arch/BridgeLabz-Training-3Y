<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Store Product Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; background: #f5f5f5; }
        #product-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
        .product-card { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 2px 8px #0001; }
        .product-card img { display: block; height: 120px; max-width: 100%; object-fit: contain; margin: 0 auto 12px; }
        .product-card h3 { font-size: 14px; }
    </style>
</head>
<body>
    <h1>Fake Store — Product Dashboard</h1>
    <div id="product-container"></div>
    <script src="Q6_Fake_Store_Product_Fetcher.js"></script>
</body>
</html>
