<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tooltip Demonstration - Gaurav Sandilya</title><link rel="stylesheet" href="Q2_tooltip.css"></head>
<body>
<header><h1>CSS Tooltip Demonstration</h1><p>Name: Gaurav Sandilya</p></header>
<main class="tooltip-container">
    <div class="tip-item"><span class="icon">★</span><span class="tooltip">This is a star tooltip</span><p>Star</p></div>
    <div class="tip-item"><span class="icon">?</span><span class="tooltip">Help and information</span><p>Help</p></div>
    <div class="tip-item"><span class="icon">✉</span><span class="tooltip">Send an email message</span><p>Email</p></div>
    <div class="tip-item"><span class="icon">✓</span><span class="tooltip">Task completed successfully</span><p>Done</p></div>
</main>
<footer>CSS-only tooltips with opacity transition • Gaurav Sandilya</footer>
</body></html>
