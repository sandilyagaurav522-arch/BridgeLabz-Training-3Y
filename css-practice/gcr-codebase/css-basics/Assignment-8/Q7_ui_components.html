<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI Components - Gaurav Sandilya</title><link rel="stylesheet" href="Q7_ui_components.css"></head>
<body>
<header><h1>Simple UI Components</h1><p>Name: Gaurav Sandilya</p></header>
<main class="card">
    <label for="search">Search</label>
    <input id="search" type="search" placeholder="Search something...">
    <label for="category">Category</label>
    <select id="category"><option>Choose category</option><option>Technology</option><option>Education</option><option>Design</option></select>
    <div class="actions"><button>Search</button><button class="secondary">Reset</button></div>
</main>
<footer>Responsive card-based interface • Gaurav Sandilya</footer>
</body></html>
