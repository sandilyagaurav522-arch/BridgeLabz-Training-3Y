<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="Q1_Responsive_Image_Filter_Gallery.css">
</head>
<body>
  <header><h1>Image Filter Gallery</h1><p>Explore how CSS filters change an image.</p></header>
  <main class="gallery">
    <figure><img class="blur" src="https://picsum.photos/id/1015/600/400" alt="Mountain lake"><figcaption>Blur</figcaption></figure>
    <figure><img class="grayscale" src="https://picsum.photos/id/1025/600/400" alt="Dog portrait"><figcaption>Grayscale</figcaption></figure>
    <figure><img class="sepia" src="https://picsum.photos/id/1035/600/400" alt="Forest"><figcaption>Sepia</figcaption></figure>
    <figure><img class="brightness" src="https://picsum.photos/id/1043/600/400" alt="Ocean"><figcaption>Brightness</figcaption></figure>
    <figure><img class="contrast" src="https://picsum.photos/id/1069/600/400" alt="Nature"><figcaption>Contrast</figcaption></figure>
    <figure><img class="hue" src="https://picsum.photos/id/1074/600/400" alt="Wildlife"><figcaption>Hue Rotate</figcaption></figure>
  </main>
</body>
</html>
