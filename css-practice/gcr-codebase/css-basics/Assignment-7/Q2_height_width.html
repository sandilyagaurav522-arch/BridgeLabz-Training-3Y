<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width - Gaurav Sandilya</title>
    <link rel="stylesheet" href="Q2_height_width.css">
</head>
<body>
    <header>
        <h1>Height & Width Practice</h1>
        <p>Name: Gaurav Sandilya</p>
    </header>

    <main class="layout">
        <section class="size-box box-px">
            <h2>PX Box</h2>
            <p>Width: 220px<br>Height: 160px</p>
        </section>

        <section class="size-box box-percent">
            <h2>Percentage Box</h2>
            <p>Width: 35% with max-width: 320px</p>
        </section>

        <section class="size-box box-vh">
            <h2>VH + EM Box</h2>
            <p>Height uses vh and text uses em. Overflow is controlled.</p>
        </section>
    </main>
</body>
</html>
