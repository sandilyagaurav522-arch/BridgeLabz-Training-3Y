<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Selectors - Gaurav Sandilya</title>
    <link rel="stylesheet" href="Q5_advanced_selectors.css">
</head>
<body>
    <header>
        <h1>Advanced CSS Selectors</h1>
        <p>Name: Gaurav Sandilya</p>
    </header>

    <main>
        <section class="selector-demo">
            <h2>Selector Practice</h2>

            <div class="items">
                <p>First paragraph inside the container.</p>
                <p>Second paragraph gets adjacent and sibling styling.</p>
                <ul>
                    <li>Item One</li>
                    <li>Item Two</li>
                    <li>Item Three</li>
                </ul>
                <p class="note">A descendant paragraph.</p>
            </div>

            <form>
                <input type="text" placeholder="Text input">
                <input type="email" placeholder="Email input">
            </form>

            <p>
                <a href="https://example.com">Secure HTTPS Link</a>
                <a href="https://github.com">Another HTTPS Link</a>
            </p>
        </section>
    </main>
</body>
</html>
