<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations - Gaurav Sandilya</title>
    <link rel="stylesheet" href="Q6_transformations.css">
</head>
<body>
    <header>
        <h1>CSS Transformations Showcase</h1>
        <p>Name: Gaurav Sandilya</p>
    </header>

    <main class="transform-container">
        <section class="transform-item">
            <div class="box rotate">Rotate</div>
            <p>rotate()</p>
        </section>
        <section class="transform-item">
            <div class="box scale">Scale</div>
            <p>scale()</p>
        </section>
        <section class="transform-item">
            <div class="box translate">Move</div>
            <p>translate()</p>
        </section>
        <section class="transform-item">
            <div class="box skew">Skew</div>
            <p>skew()</p>
        </section>
    </main>
</body>
</html>
