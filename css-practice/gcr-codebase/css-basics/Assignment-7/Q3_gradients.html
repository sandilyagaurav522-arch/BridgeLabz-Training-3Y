<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Backgrounds - Gaurav Sandilya</title>
    <link rel="stylesheet" href="Q3_gradients.css">
</head>
<body>
    <header><h1>CSS Gradient Showcase</h1><p>Gaurav Sandilya</p></header>

    <main>
        <section class="gradient linear">
            <div class="content">
                <h2>Linear Gradient</h2>
                <p>A linear gradient changes color progressively along a straight direction.</p>
            </div>
        </section>

        <section class="gradient radial">
            <div class="content">
                <h2>Radial Gradient</h2>
                <p>A radial gradient spreads colors outward from a central point.</p>
            </div>
        </section>
    </main>

    <footer><p>Gradient Background Practice</p></footer>
</body>
</html>
