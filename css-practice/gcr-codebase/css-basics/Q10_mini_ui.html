<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini User Interface - Gaurav Sandilya</title><link rel="stylesheet" href="Q10_mini_ui.css"></head>
<body>
<header><div><strong>StudyHub</strong><span> | Mini User Interface</span></div><p>Student: Gaurav Sandilya</p></header>
<main class="main">
    <section class="card">
        <div class="image-wrap"><img src="https://picsum.photos/seed/study/500/300" alt="Study desk"></div>
        <div class="content">
            <h1>Start Learning</h1>
            <p>Fill the form below to explore a simple responsive interface.</p>
            <form>
                <label for="name">Name</label>
                <input id="name" type="text" placeholder="Enter your name" required>
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="Enter your email" required>
                <div class="buttons"><button type="submit">Get Started</button><button type="reset" class="reset">Reset</button></div>
            </form>
        </div>
    </section>
</main>
<footer>CSS Fundamentals • Assignment 8 • Gaurav Sandilya</footer>
</body></html>
