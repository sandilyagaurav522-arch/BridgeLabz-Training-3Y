<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Location Selection</title>
</head>
<body>
    <h1>Travel Selection</h1>

    <label for="country">Country:</label>
    <select id="country">
        <option selected>India</option>
        <option>Japan</option>
        <option>France</option>
        <option>UAE</option>
    </select>
    <br><br>

    <label for="state">State:</label>
    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Maharashtra</option>
        <option>Rajasthan</option>
        <option>Kerala</option>
    </select>
    <br><br>

    <label for="city">City:</label>
    <select id="city">
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Lucknow</option>
        <option>Varanasi</option>
    </select>
    <br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option selected>Taj Mahal</option>
        <option>Vrindavan</option>
        <option>Gateway of India</option>
        <option>Jaipur City Palace</option>
    </select>

    <p>My choices are India, Uttar Pradesh, Mathura, and Taj Mahal.</p>
</body>
</html>
