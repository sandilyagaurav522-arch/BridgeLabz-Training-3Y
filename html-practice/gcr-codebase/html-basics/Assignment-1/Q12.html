<!DOCTYPE html>
<html>
<head>
    <title>Inline Formatting</title>
</head>
<body>
    <!-- Multiple inline formatting elements -->
    <p>
        <strong>Welcome!</strong>
        My name is <em>Gaurav</em> and I am learning
        <mark>HTML</mark>. I want to become a
        <b>web developer</b> and build <i>creative websites</i>.
    </p>
</body>
</html>
