<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map</title>
    <!-- Assignment 3 - Question 2 -->
</head>
<body>
    <h1>Map of GLA University, Mathura</h1>
    <!-- loading="lazy" delays loading the iframe until it is close to the visible area. -->
    <iframe
        title="Google Map showing GLA University, Mathura"
        width="100%"
        height="450"
        loading="lazy"
        src="https://www.google.com/maps?q=GLA%20University%20Mathura&output=embed">
    </iframe>
</body>
</html>
