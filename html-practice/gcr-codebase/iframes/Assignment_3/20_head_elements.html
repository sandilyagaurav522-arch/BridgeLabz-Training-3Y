<!DOCTYPE html>
<html lang="en">
<head>
    <!-- The title defines the text shown in the browser tab. -->
    <title>Important Head Elements</title>

    <!-- UTF-8 allows the page to correctly represent a wide range of characters. -->
    <meta charset="UTF-8">

    <!-- The description provides a summary of the webpage for search engines and other tools. -->
    <meta name="description" content="A demonstration of important HTML head elements.">

    <!-- The author identifies the person who created the page. -->
    <meta name="author" content="Gaurav Sandilya">

    <!-- The base element sets the base URL used for relative URLs on the page. -->
    <base href="https://example.com/">

    <!-- The link element can connect the page to an external resource such as a favicon. -->
    <link rel="icon" href="data:,">

    <!-- The style element contains CSS rules; it is intentionally empty for this assignment. -->
    <style></style>

    <!-- The script element contains JavaScript; it is intentionally empty for this assignment. -->
    <script></script>
</head>
<body>
    <h1>Important HTML Head Elements</h1>
    <p>This page demonstrates the required elements inside the head section.</p>
</body>
</html>
